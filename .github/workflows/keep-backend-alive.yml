name: Keep Backend Alive

on:
  schedule:
    # Run every 14 minutes to prevent free-tier backends (like Render) from sleeping
    - cron: "*/14 * * * *"
  # Allow manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API Health Check
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Error: BACKEND_URL secret is missing."
            echo "Please add it in your GitHub repository settings under Settings -> Secrets and variables -> Actions."
            echo "Example: BACKEND_URL=https://your-drivora-backend.onrender.com"
            exit 1
          fi

          echo "Pinging Backend to keep it active..."
          
          # We query the health endpoint to keep the server awake
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/v1/health")

          echo "Backend responded with HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Ping successful!"
          else
            echo "Ping received non-200 status. Server might be down or waking up."
          fi
